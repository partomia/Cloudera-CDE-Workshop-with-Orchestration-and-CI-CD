name: CI - Lint, Test & Validate

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: "3.8"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with pylint
        run: |
          pylint jobs/ dags/ --fail-under=8.0 \
            --disable=C0114,C0115,C0116,W0611

      - name: Format check with black
        run: black --check jobs/ dags/ tests/

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v \
            --cov=jobs \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml

  ge-dry-run:
    name: GE Expectation Suite Validation
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: "3.8"

      - name: Install GE
        run: pip install great-expectations==0.18.9 pyspark==3.3.2 pandas pyarrow

      - name: Validate expectation suite syntax
        run: |
          python - <<'EOF'
          import json, sys
          with open("great_expectations/expectations/retail_raw_suite.json") as f:
              suite = json.load(f)
          assert "expectation_suite_name" in suite
          assert len(suite["expectations"]) > 0
          print(f"OK: {len(suite['expectations'])} expectations found in suite.")
          EOF

      - name: Run GE against sample data
        run: |
          python - <<'EOF'
          import pandas as pd
          import great_expectations as gx
          from great_expectations.core.batch import RuntimeBatchRequest

          context = gx.get_context(context_root_dir="great_expectations")
          df = pd.read_csv("data/sample/retail_orders.csv")

          batch_request = RuntimeBatchRequest(
              datasource_name="spark_datasource",
              data_connector_name="runtime_data_connector",
              data_asset_name="raw_orders",
              runtime_parameters={"batch_data": df},
              batch_identifiers={"run_id": "ci_dry_run"},
          )

          result = context.run_checkpoint(
              checkpoint_name="raw_checkpoint",
              validations=[{
                  "batch_request": batch_request,
                  "expectation_suite_name": "retail_raw_suite",
              }]
          )

          if not result.success:
              print("GE validation FAILED in CI dry run")
              sys.exit(1)
          print("GE validation passed.")
          EOF
