name: CD - Deploy to Cloudera CDE

on:
  push:
    branches: [main]

jobs:
  deploy-reminder:
    name: Post-merge Deploy Reminder
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Cloudera does not provide a public or programmatic download for the CDE CLI —
      # it's an authenticated, per-virtual-cluster binary from CDP Console -> Data
      # Engineering -> Cluster details -> CLI TOOL. That means GitHub-hosted runners
      # can't install it, and this repo is public so we can't redistribute Cloudera's
      # binary as a release asset either. Deployment is a manual step for now.
      #
      # To get full automation, either:
      #   - register a self-hosted runner (on a machine with the CDE CLI installed) and
      #     point this workflow's `runs-on` at it, or
      #   - host the CLI binary in a private mirror repo/artifact store your org controls
      #     and pull it here with a token.
      - name: Manual deploy required
        run: |
          cat <<'EOF'
          ============================================================
          main branch updated — CDE deployment is a MANUAL step.

          Cloudera does not offer a public download for the CDE CLI,
          so GitHub-hosted runners cannot install it automatically.

          To deploy this change, run from a machine with the CDE CLI
          installed and configured (~/.cde/config.yaml):

            ./scripts/deploy_jobs.sh
            ./scripts/deploy_dag.sh

          or simply:

            make deploy

          See modules/07-cicd/README.md for details.
          ============================================================
          EOF
